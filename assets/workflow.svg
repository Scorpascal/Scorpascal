<svg id="still" xmlns="http://www.w3.org/2000/svg" width="960" height="144" viewBox="0 0 960 144" role="img" aria-labelledby="title desc"><title id="title">Question, build, verify, refine</title><desc id="desc">A decorative research and engineering loop. Moving light travels through four stages. It represents a working approach, not project progress.</desc><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="960" y2="0"><stop stop-color="#5edbea"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#efc688"/></linearGradient></defs><style>svg:target *{animation:none!important}.packet{animation:flow 10s linear infinite}@keyframes flow{to{stroke-dashoffset:-960}}@media(max-width:600px){.labels{font-size:34px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="959" height="143" rx="16" fill="#101729" stroke="#2b3550"/><path d="M155 50H804" stroke="url(#g)" opacity=".3" stroke-width="2"/><path d="M155 50H804" stroke="url(#g)" stroke-width="3" stroke-dasharray="44 916" stroke-linecap="round" class="packet"/><path d="M813 95v25H145v-25" fill="none" stroke="#8490bc" opacity=".22" stroke-dasharray="3 7"/><g fill="#18223a" stroke-width="1.6"><circle cx="155" cy="50" r="24" stroke="#5edbea"/><circle cx="370" cy="50" r="24" stroke="#9eacff"/><circle cx="590" cy="50" r="24" stroke="#c49ef2"/><circle cx="805" cy="50" r="24" stroke="#efc688"/></g><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M148 43c0-10 18-10 18 0 0 7-11 5-11 12m0 7v1" stroke="#5edbea"/><path d="M362 42l-9 8 9 8m16-16 9 8-9 8m-5-20-6 24" stroke="#9eacff"/><path d="M579 50l7 7 15-16" stroke="#c49ef2"/><path d="M813 42a12 12 0 1 0 2 13m1-20v10h-10" stroke="#efc688"/></g><g class="labels" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#e3e8fa"><text x="155" y="100">Question</text><text x="370" y="100">Build</text><text x="590" y="100">Verify</text><text x="805" y="100">Refine</text></g></svg>
