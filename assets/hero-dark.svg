<svg id="still" xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Scorpascal — research, engineering, exploration</title><desc id="desc">A luminous constellation with slowly rotating orbital rings beside the name Scorpascal. Decorative motion stops when reduced motion is requested.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080f20"/><stop offset="1" stop-color="#12122b"/></linearGradient><linearGradient id="ink"><stop stop-color="#ffffff"/><stop offset=".62" stop-color="#cbd5ff"/><stop offset="1" stop-color="#80e1ef"/></linearGradient><linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="960" y2="0"><stop stop-color="#5edbea"/><stop offset=".48" stop-color="#a78bfa"/><stop offset="1" stop-color="#df9aeb"/></linearGradient><radialGradient id="violet"><stop stop-color="#9571ff" stop-opacity=".3"/><stop offset="1" stop-color="#9571ff" stop-opacity="0"/></radialGradient><radialGradient id="cyan"><stop stop-color="#31d0df" stop-opacity=".2"/><stop offset="1" stop-color="#31d0df" stop-opacity="0"/></radialGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter><clipPath id="clip"><rect width="960" height="340" rx="24"/></clipPath></defs><style>svg:target *{animation:none!important}.orbit{transform-origin:765px 165px;animation:spin 32s linear infinite}.reverse{animation-direction:reverse;animation-duration:46s}.signal{animation:flow 15s linear infinite}.halo{animation:breathe 8s ease-in-out infinite}.stars{animation:twinkle 7s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-900}}@keyframes breathe{50%{opacity:.42}}@keyframes twinkle{50%{opacity:.5}}@media(max-width:600px){.name{font-size:118px}.tagline{font-size:27px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g clip-path="url(#clip)"><re